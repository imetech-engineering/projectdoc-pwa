name: Zelftest bridge

on:
  push:
    paths: ["bridge/**", ".github/workflows/test.yml"]
  pull_request:
    paths: ["bridge/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node test/test.js
        working-directory: bridge
