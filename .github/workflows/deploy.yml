# Publiceert de map pwa/ naar GitHub Pages (site-root = de PWA).
# Na de eerste push: Settings → Pages → Source: GitHub Actions.

name: Deploy projectdoc PWA

on:
  push:
    branches: [main]
    paths:
      - "pwa/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-projectdoc-pwa
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pwa

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
